# Dependabot warns (with a pull request) when there are new versions of the
# Python dependencies and of the actions the CI uses. Once a month, so as not
# to fill the repository with notices.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # Major versions of customtkinter and Pillow can change how the interface looks or how
    # photos are read, and PyInstaller changes the .exe: they are updated by hand,
    # checking the window and the executable, not with an automatic notice.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyinstaller"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
