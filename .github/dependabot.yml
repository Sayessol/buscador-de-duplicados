# Dependabot avisa (con una pull request) cuando hay versiones nuevas de las
# dependencias de Python y de las acciones que usa el CI. Una vez al mes, para
# no llenar el repositorio de avisos.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencias"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencias"]
