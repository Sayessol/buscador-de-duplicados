# Dependabot avisa (con una pull request) cuando hay versiones nuevas de las
# dependencias de Python y de las acciones que usa el CI. Una vez al mes, para
# no llenar el repositorio de avisos.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencias"]
    # Las versiones mayores de customtkinter y Pillow pueden cambiar cómo se ve la
    # interfaz o cómo se leen las fotos, y PyInstaller cambia el .exe: se actualizan
    # a mano, comprobando la ventana y el ejecutable, no con un aviso automático.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyinstaller"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencias"]
