name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy, core)
        run: python -m mypy
      - name: Tests with coverage (core and UI)
        run: python -m pytest --cov --cov-report=term-missing
      - name: Minimum core coverage (90 %)
        run: python -m coverage report --include="core/*" --fail-under=90
      - name: Minimum UI coverage (70 %)
        run: python -m coverage report --include="ui/*" --fail-under=70
