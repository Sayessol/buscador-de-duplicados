name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy, logic layers)
        run: python -m mypy
      - name: Tests with coverage (logic and interface)
        run: python -m pytest --cov --cov-report=term-missing
      - name: Minimum logic coverage (90 %)
        run: python -m coverage report --include="src/duplicate_finder/domain/*,src/duplicate_finder/application/*,src/duplicate_finder/infrastructure/*,src/duplicate_finder/i18n/*" --fail-under=90
      - name: Minimum interface coverage (70 %)
        run: python -m coverage report --include="src/duplicate_finder/presentation/*" --fail-under=70
