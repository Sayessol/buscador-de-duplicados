name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

# Four independent jobs: a style problem shows up without waiting for the tests, and the
# `tests` one is the check the branch protection requires.
jobs:
  lint:
    name: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff)
        run: ruff format --check .

  types:
    name: types
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Types (mypy, whole package)
        run: python -m mypy

  tests:
    name: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests with coverage (logic and interface)
        run: python -m pytest --cov --cov-report=term-missing
      - name: Minimum logic coverage (90 %)
        run: python -m coverage report --include="src/duplicate_finder/domain/*,src/duplicate_finder/application/*,src/duplicate_finder/infrastructure/*,src/duplicate_finder/i18n/*" --fail-under=90
      - name: Minimum interface coverage (70 %)
        run: python -m coverage report --include="src/duplicate_finder/presentation/*" --fail-under=70
