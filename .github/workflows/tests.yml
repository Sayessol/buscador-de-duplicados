name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Linter (ruff)
        run: ruff check .
      - name: Tipos (mypy, núcleo)
        run: python -m mypy
      - name: Pruebas con cobertura (núcleo e interfaz)
        run: python -m pytest --cov --cov-report=term-missing
      - name: Cobertura mínima del núcleo (90 %)
        run: python -m coverage report --include="core/*" --fail-under=90
      - name: Cobertura mínima de la interfaz (70 %)
        run: python -m coverage report --include="ui/*" --fail-under=70
