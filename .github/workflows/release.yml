name: Publish .exe

# Runs when a tag like v1.0.0 is created
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check that the tag matches the version in the code
        shell: pwsh
        run: |
          $inCode = python -c "from core import __version__; print(__version__)"
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($inCode -ne $tag) {
            Write-Error "The tag ($tag) does not match core.__version__ ($inCode)"
            exit 1
          }
      - name: Build the single-file .exe
        run: python build_exe.py
      - name: Build the folder version (ZIP)
        run: python build_exe.py --folder --zip
      - name: Rename the release files
        run: |
          Copy-Item dist/duplicados.exe Buscador-de-duplicados.exe
          Copy-Item dist/Buscador-de-duplicados.zip Buscador-de-duplicados-portable.zip
        shell: pwsh
      - name: Release notes (section of CHANGELOG.md)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = "(?ms)^## \[" + [regex]::Escape($version) + "\][^\n]*\n(.*?)(?=^## \[|\z)"
          $m = [regex]::Match($text, $pattern)
          if ($m.Success) { $notes = $m.Groups[1].Value.Trim() } else { $notes = "Version $version" }
          $notes += "`n`n---`n**What to download** (you do not need to install Python):`n" +
                    "- **Buscador-de-duplicados.exe**: a single file, the most convenient.`n" +
                    "- **Buscador-de-duplicados-portable.zip**: unzip it into a folder with a short path " +
                    "(for example ``C:\Apps``) and open ``Buscador-de-duplicados.exe``. " +
                    "Use it if your antivirus blocks or delays the single .exe.`n`n" +
                    "Windows SmartScreen or your antivirus may warn you because the program is not signed.`n`n" +
                    "**Qué descargar** (no necesitas instalar Python): el ``.exe`` es un solo archivo; " +
                    "el ZIP portable es para cuando tu antivirus bloquea o retrasa el ``.exe``. " +
                    "Windows SmartScreen o tu antivirus pueden avisar porque el programa no está firmado."
          Set-Content notes.md $notes -Encoding utf8
      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Buscador-de-duplicados.exe
            Buscador-de-duplicados-portable.zip
          body_path: notes.md
