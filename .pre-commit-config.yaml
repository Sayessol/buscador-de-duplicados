# Checks that run before every commit:  pip install pre-commit  &&  pre-commit install
# (the same checks run in CI, so skipping them locally only postpones the failure)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (whole package)
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
