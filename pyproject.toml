# Tool configuration only (linter and tests).
# The app is NOT installed with pip: it is run with `python app.py` or with the .exe.

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/origin holds the original script, kept as it is as a historical piece
extend-exclude = ["build", "dist", "docs/origin"]

[tool.ruff.lint]
# E/W: pycodestyle style · F: real errors (unused imports, undefined names)
# B: typical bugs (bugbear)
select = ["E", "F", "W", "B"]
ignore = ["B905"]   # zip(strict=...) adds nothing here

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = ["gui: test with a window (needs a Windows desktop)"]

[tool.coverage.run]
source = ["core", "ui"]
# The window tests run in separate processes (tests/test_suites.py): they are followed
# so the interface can be measured too. Minimums the CI requires: core 90 %, UI 70 %.
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
# Static typing: the core (core/) is fully annotated and mypy checks it.
# The interface (ui/) is not checked: CustomTkinter/Tkinter are very dynamic and the
# benefit would be much smaller than the noise.
python_version = "3.12"
files = ["core"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
